<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リアルタイム地震・強震モニタ監視ダッシュボード</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 { font-size: 1.5rem; color: #fff; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 { margin-top: 0; font-size: 1.2rem; color: #4dabf7; }
        #status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .connected { background-color: #2b8a3e; color: #fff; }
        .disconnected { background-color: #c92a2a; color: #fff; }
        
        .eew-log {
            background-color: #000;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            color: #51cf66;
        }
        .alert-box {
            background-color: #490505;
            border: 1px solid #e03131;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }
        .alert-box.active { display: block; animation: blink 1s infinite; }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .monitor-img-container {
            text-align: center;
            margin-top: 10px;
        }
        .monitor-img-container img {
            max-width: 100%;
            border-radius: 4px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>🌐 リアルタイム地震・強震モニタ監視アプリ</h1>
    <p>接続状態: <span id="status" class="disconnected">切断中</span></p>

    <div class="container">
        <!-- 左側：Wolfx EEW速報パネル -->
        <div class="card">
            <h2>🚨 緊急地震速報 (Wolfx API)</h2>
            <div id="eewAlertBox" class="alert-box">
                <h3 style="margin:0 0 5px 0; color:#ff6b6b;">⚠️ 強い揺れに警戒してください！</h3>
                <p id="alertText" style="margin:0; font-weight:bold;"></p>
            </div>
            <p>受信ログ:</p>
            <div id="eewLog" class="eew-log">接続を待機しています...</div>
        </div>

        <!-- 右側：強震モニタ画像パネル -->
        <div class="card">
            <h2>📈 強震モニタ (防災科学技術研究所)</h2>
            <p style="font-size: 0.85rem; color: #aaa;">数秒ごとに自動更新されます</p>
            <div class="monitor-img-container">
                <!-- 強震モニタのリアルタイム画像URL (サンプル構成) -->
                <img id="kyoshinImg" src="" alt="強震モニタ画像読み込み中...">
            </div>
        </div>
    </div>

    <script>
        // --- 1. WebSocket (Wolfx API) 接続設定 ---
        const wsUrl = "wss://ws-api.wolfx.jp/jma_eew";
        let ws;

        const statusElem = document.getElementById("status");
        const eewLogElem = document.getElementById("eewLog");
        const alertBox = document.getElementById("eewAlertBox");
        const alertText = document.getElementById("alertText");

        function connectWebSocket() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusElem.textContent = "接続完了 (常時監視中)";
                statusElem.className = "connected";
                appendLog("Wolfx WebSocket に接続しました。");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // ハートビートはスキップ
                    if (data.type === "heartbeat") return;

                    if (data.isCancel) {
                        appendLog(`【キャンセル報】 ID: ${data.ID}`);
                        resetAlert();
                        return;
                    }

                    // データの抽出
                    const reportNum = data.ReportNum || "?";
                    const hypo = data.HypoCenter || "不明";
                    const mag = data.Magnitude || "0.0";
                    const maxInt = data.MaxIntensity || "不明";
                    const isFinal = data.isFinal ? "【最終報】" : "";

                    let logMessage = `[第${reportNum}報] ${isFinal}\n` +
                                     ` 震源: ${hypo} (M${mag})\n` +
                                     ` 予想最大震度: ${maxInt}\n`;

                    appendLog(logMessage);

                    // 揺れ検知・アラート判定 (震度4以上、または警報が含まれる場合)
                    // ※Wolfxの震度表現（例: "4", "5弱", "5-" などに対応）
                    const highIntensities = ["4", "5弱", "5強", "6弱", "6強", "7", "5-", "5+", "6-", "6+"];
                    if (highIntensities.includes(maxInt)) {
                        triggerAlert(`最大震度 ${maxInt} 程度の強い揺れが予想されます！ (${hypo})`);
                    }

                } catch (err) {
                    console.error("JSONパースエラー:", err);
                }
            };

            ws.onclose = () => {
                statusElem.textContent = "切断されました (再接続中...)";
                statusElem.className = "disconnected";
                appendLog("WebSocketが切断されました。3秒後に再接続します。");
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error("WebSocketエラー:", error);
            };
        }

        function appendLog(text) {
            const timeStr = new Date().toLocaleTimeString();
            eewLogElem.innerHTML += `[${timeStr}] ${text}\n`;
            eewLogElem.scrollTop = eewLogElem.scrollHeight; // 自動スクロール
        }

        function triggerAlert(message) {
            alertBox.classList.add("active");
            alertText.textContent = message;
            // 必要に応じてWeb Audio APIで警告音を鳴らすことも可能
        }

        function resetAlert() {
            alertBox.classList.remove("active");
            alertText.textContent = "";
        }

        // --- 2. 強震モニタ画像の定期リロード処理 ---
        // 防災科研の強震モニタ画像URL仕様（例としてタイムスタンプを付与してキャッシュを回避）
        function updateKyoshinImage() {
            const imgElem = document.getElementById("kyoshinImg");
            const now = new Date();
            // 例: 強震モニタのリアルタイムGIF画像等のエンドポイント
            // （実際のURL構造やCORSポリシーに注意してください。必要に応じて代理プロキシを挟む場合があります）
            const timestamp = now.getTime();
            
            // 下記はサンプルURLです。実際の強震モニタの仕様に合わせてパスを変更してください
            // ※NIED公式の直リンクはCORSや規約に注意が必要です
            imgElem.src = `http://www.k-net.bosai.go.jp/k-net/kyoshin/images/realtime/latest.gif?t=${timestamp}`;
        }

        // 初回実行と定期実行 (5秒おき)
        updateKyoshinImage();
        setInterval(updateKyoshinImage, 5000);

        // 起動時に接続開始
        connectWebSocket();
    </script>
</body>
</html>
