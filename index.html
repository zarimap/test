<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リアルタイムEEW & 強震モニタ・PS波マップ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f111a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* 左側：サイドパネル（ログ・詳細） */
        #sidebar {
            width: 380px;
            background-color: #161925;
            border-right: 1px solid #2a2f45;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .header {
            padding: 15px;
            background-color: #1f2438;
            border-bottom: 1px solid #2a2f45;
        }
        .header h1 { font-size: 1.1rem; margin: 0 0 5px 0; color: #4dabf7; }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .connected { background-color: #2b8a3e; color: #fff; }
        .disconnected { background-color: #c92a2a; color: #fff; }

        .log-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            background-color: #0b0d14;
            color: #51cf66;
        }
        
        /* 警報アラートボックス */
        .eew-alert {
            margin: 15px;
            padding: 12px;
            background-color: #5c1d1d;
            border: 1px solid #fa5252;
            border-radius: 6px;
            display: none;
        }
        .eew-alert.active { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* 右側：マップ領域 */
        #map {
            flex: 1;
            height: 100%;
            background-color: #0f111a;
        }

        /* マップ上のカスタムポップアップや凡例 */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1f2438 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>

    <!-- サイドパネル -->
    <div id="sidebar">
        <div class="header">
            <h1>🌐 Wolfx EEW リアルタイムマップ</h1>
            <div>接続状態: <span id="wsStatus" class="status-badge disconnected">切断中</span></div>
        </div>

        <div id="alertBox" class="eew-alert">
            <strong style="color: #ff6b6b;">⚠️ 緊急地震速報 発令中</strong>
            <p id="alertDetails" style="margin: 5px 0 0 0; font-size: 0.9rem;"></p>
        </div>

        <div style="padding: 10px 15px 0 15px; font-size: 0.85rem; color: #8b9bb4; font-weight: bold;">受信ログ / 解析データ</div>
        <div id="logBox" class="log-container">システム初期化中...</div>
    </div>

    <!-- 地図コンテナ -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. ダーク基調地図の初期化 (CartoDB Dark Matter: 海溝や地形・国境線がダーク表示される) ---
        const map = L.map('map', {
            center: [38.0, 137.0], // 日本中心
            zoom: 5,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomright' }).addTog(map);

        // Dark Matterタイル
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // --- 2. 状態管理・レイヤー変数 ---
        let hypoMarker = null;
        let pWaveCircle = null;
        let sWaveCircle = null;
        let areaLayers = []; // 予想震度の地域レイヤー群
        let currentHypo = null; // {lat, lon, time}
        
        // P波・S波の速度設定 (km/s)
        const P_SPEED = 6.5;
        const S_SPEED = 3.5;
        let earthquakeStartTime = null;

        const wsStatus = document.getElementById("wsStatus");
        const logBox = document.getElementById("logBox");
        const alertBox = document.getElementById("alertBox");
        const alertDetails = document.getElementById("alertDetails");

        // --- 3. Wolfx WebSocket 接続 ---
        const wsUrl = "wss://ws-api.wolfx.jp/jma_eew";
        let ws;

        function connectWS() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                wsStatus.textContent = "常時接続中";
                wsStatus.className = "status-badge connected";
                appendLog("Wolfx WebSocket に接続しました。");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "heartbeat") return;

                    if (data.isCancel) {
                        appendLog(`【キャンセル報】 ID: ${data.ID}`);
                        resetAllLayers();
                        return;
                    }

                    parseEEW(data);
                } catch (e) {
                    console.error("JSONパースエラー:", e);
                }
            };

            ws.onclose = () => {
                wsStatus.textContent = "切断 (再接続中...)";
                wsStatus.className = "status-badge disconnected";
                appendLog("切断されました。3秒後に再接続します。");
                setTimeout(connectWS, 3000);
            };
        }

        function appendLog(text) {
            const timeStr = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${timeStr}] ${text}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- 4. EEW電文の解析と地図反映 ---
        function parseEEW(data) {
            const reportNum = data.ReportNum || "?";
            const hypo = data.HypoCenter || "不明";
            const mag = data.Magnitude || 0.0;
            const maxInt = data.MaxIntensity || "不明";
            const lat = data.Latitude;
            const lon = data.Longitude;
            const isFinal = data.isFinal ? "【最終報】" : "";

            appendLog(`[第${reportNum}報] ${isFinal} 震源:${hypo} (M${mag}) 予想最大震度:${maxInt}`);

            if (!lat || !lon) {
                appendLog("-> 震源の緯度・経度情報がまだありません。");
                return;
            }

            // アラート表示の更新
            alertBox.classList.add("active");
            alertDetails.innerHTML = `震源: ${hypo}<br>規模: M${mag} / 最大予想震度: ${maxInt}`;

            // 震源位置・時間の更新
            currentHypo = { lat: lat, lon: lon };
            earthquakeStartTime = Date.now(); // 簡易的に受信/更新時刻を起点にする（正確には発震時刻があればそれを利用）

            updateMapElements(lat, lon, hypo, mag, maxInt, data.WarnArea || []);
        }

        // --- 5. 地図上の描画更新 (震源・P/S波・予想震度エリア) ---
        function updateMapElements(lat, lon, hypo, mag, maxInt, warnAreas) {
            // 既存の震源マーカー・波面をクリア
            if (hypoMarker) map.removeLayer(hypoMarker);
            if (pWaveCircle) map.removeLayer(pWaveCircle);
            if (sWaveCircle) map.removeLayer(sWaveCircle);
            areaLayers.forEach(layer => map.removeLayer(layer));
            areaLayers = [];

            // 震源地マーカー (赤色の光るポイント)
            hypoMarker = L.circleMarker([lat, lon], {
                radius: 8,
                color: '#fff',
                weight: 2,
                fillColor: '#ff4d4f',
                fillOpacity: 1
            }).addTo(map).bindPopup(`<b>震源地: ${hypo}</b><br>Magnitude: ${mag}<br>最大震度: ${maxInt}`);

            // 地図を震源にフォーカス
            map.setView([lat, lon], 7);

            // 初期状態のP波・S波の円を作成（半径0mからスタート）
            pWaveCircle = L.circle([lat, lon], {
                radius: 0,
                color: '#3bc9db',      // 水色 (P波)
                weight: 1,
                fillColor: '#3bc9db',
                fillOpacity: 0.1,
                dashArray: '4, 4'
            }).addTo(map);

            sWaveCircle = L.circle([lat, lon], {
                radius: 0,
                color: '#ff6b6b',      // 赤・オレンジ (S波)
                weight: 2,
                fillColor: '#ff6b6b',
                fillOpacity: 0.2
            }).addTo(map);

            // 予想地域（WarnArea）の簡易プロット（サンプルとして震源周辺やダミー位置、または固定地域データと連動）
            // ※本格的に各都道府県の面を塗りつぶす場合は都道府県別のGeoJSONデータ等を用意して結合しますが、
            //   ここでは簡易的にWarnAreaに含まれる地域名や、ダミーの広がり表現、あるいは円形プロットを表示する例に拡張できます。
            warnAreas.forEach((area, index) => {
                const areaName = area.AreaName || area.Chiiki || "対象地域";
                const alertType = area.Type || "予報";
                
                // 震源からの距離に見立てて、周囲にエリアの円を配置する例（あるいは固定の緯度経度マッピング）
                // 実際の実装では、地域名に対応する緯度経度辞書やGeoJSONポリゴンを使用します
                appendLog(`  - 警戒地域: ${areaName} (${alertType})`);
            });
        }

        // --- 6. P波・S波のリアルタイム拡大アニメーション (毎秒実行) ---
        setInterval(() => {
            if (!currentHypo || !earthquakeStartTime) return;

            // 経過時間（秒）
            const elapsedSeconds = (Date.now() - earthquakeStartTime) / 1000;

            // 距離（メートル換算） = 速度(km/s) * 経過時間 * 1000
            const pRadius = P_SPEED * elapsedSeconds * 1000;
            const sRadius = S_SPEED * elapsedSeconds * 1000;

            if (pWaveCircle) pWaveCircle.setRadius(pRadius);
            if (sWaveCircle) sWaveCircle.setRadius(sRadius);

        }, 100); // 100msごとに滑らかに拡大

        function resetAllLayers() {
            if (hypoMarker) map.removeLayer(hypoMarker);
            if (pWaveCircle) map.removeLayer(pWaveCircle);
            if (sWaveCircle) map.removeLayer(sWaveCircle);
            alertBox.classList.remove("active");
            currentHypo = null;
        }

        // アプリ起動時に接続開始
        connectWS();
    </script>
</body>
</html>
