<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リアルタイムEEW & 強震モニタ・PS波マップ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f111a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* サイドパネル（右側） */
        #sidebar {
            width: 420px;
            background-color: #161925;
            border-left: 1px solid #2a2f45;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
            z-index: 1000;
            order: 2;
        }
        .header {
            padding: 15px;
            background-color: #1f2438;
            border-bottom: 1px solid #2a2f45;
            flex-shrink: 0;
        }
        .header h1 { font-size: 1.1rem; margin: 0 0 5px 0; color: #4dabf7; }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .connected { background-color: #2b8a3e; color: #fff; }
        .disconnected { background-color: #c92a2a; color: #fff; }

        /* ログコンテナ（スクロール可能） */
        .log-wrapper {
            padding: 10px 15px 0 15px;
            font-size: 0.85rem;
            color: #8b9bb4;
            font-weight: bold;
            flex-shrink: 0;
        }
        .log-container {
            height: 140px;
            margin: 5px 15px 10px 15px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            background-color: #0b0d14;
            color: #51cf66;
            white-space: pre-wrap;
            border: 1px solid #2a2f45;
            border-radius: 4px;
            flex-shrink: 0;
        }
        
        /* 右下の強震モニタ埋め込みエリア */
        .kmoni-section {
            background-color: #11141d;
            border-top: 1px solid #2a2f45;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .kmoni-title {
            width: 100%;
            font-size: 0.75rem;
            color: #8b9bb4;
            font-weight: bold;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        
        .kmoni-frame-wrapper {
            width: 100%;
            height: 528px; 
            overflow: hidden;
            position: relative;
            border-radius: 4px;
            background-color: #000;
        }
        .kmoni-frame {
            width: 1200px;  
            height: 900px; 
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            transform: scale(0.768);
            transform-origin: top left;
        }

        /* 警報アラートボックス */
        .eew-alert {
            margin: 15px 15px 0 15px;
            padding: 12px;
            background-color: #5c1d1d;
            border: 1px solid #fa5252;
            border-radius: 6px;
            display: none;
            flex-shrink: 0;
        }
        .eew-alert.active { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* 地図領域（左側） */
        #map {
            flex: 1;
            height: 100%;
            background-color: #1a1a1a;
            order: 1;
        }

        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1f2438 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>

    <!-- 地図コンテナ（左側） -->
    <div id="map"></div>

    <!-- サイドパネル（右側） -->
    <div id="sidebar">
        <div class="header">
            <h1>🌐 Wolfx EEW リアルタイム監視</h1>
            <div>WebSocket接続: <span id="wsStatus" class="status-badge disconnected">切断中</span></div>
        </div>

        <div id="alertBox" class="eew-alert">
            <strong style="color: #ff6b6b;">⚠️ 緊急地震速報 発令中</strong>
            <p id="alertDetails" style="margin: 5px 0 0 0; font-size: 0.9rem;"></p>
        </div>

        <!-- ログセクション（スクロール可能） -->
        <div class="log-wrapper">受信ログ & 地域別予想震度</div>
        <div id="logBox" class="log-container">システム初期化中... WebSocket接続を待機しています。</div>

        <!-- 右下：強震モニタセクション -->
        <div class="kmoni-section">
            <div class="kmoni-title">📈 リアルタイム強震モニタ (eqdata)</div>
            <div class="kmoni-frame-wrapper">
                <iframe src="https://eqdata.sakura.ne.jp/kyoshin/2sec_i.html" class="kmoni-frame"></iframe>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. 地図初期化 (APIキー不要・ダークモード対応) ---
        const map = L.map('map', {
            center: [38.0, 137.0],
            zoom: 5,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // OSM標準タイルにダークフィルター適用
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        const darkStyle = document.createElement('style');
        darkStyle.innerHTML = `
            .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
            .leaflet-container { background-color: #111 !important; }
        `;
        document.head.appendChild(darkStyle);

        // --- 2. 状態管理・レイヤー・算出用変数 ---
        let hypoMarker = null;
        let pWaveCircle = null;
        let sWaveCircle = null;
        let currentHypo = null;
        
        let P_SPEED = 6.5; 
        let S_SPEED = 3.5; 
        let earthquakeStartTime = null; // 正確な地震発生時刻（ms）

        let reportHistory = [];

        const wsStatus = document.getElementById("wsStatus");
        const logBox = document.getElementById("logBox");
        const alertBox = document.getElementById("alertBox");
        const alertDetails = document.getElementById("alertDetails");

        // --- 3. Wolfx WebSocket 常時接続処理 ---
        const wsUrl = "wss://ws-api.wolfx.jp/jma_eew";
        let ws;

        function connectWS() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                wsStatus.textContent = "接続中 (常時監視)";
                wsStatus.className = "status-badge connected";
                appendLog("Wolfx WebSocket に接続しました。");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "heartbeat") return;

                    if (data.isCancel) {
                        appendLog(`【キャンセル報】 ID: ${data.ID}`);
                        resetAllLayers();
                        return;
                    }

                    parseEEW(data);
                } catch (e) {
                    console.error("JSONパースエラー:", e);
                }
            };

            ws.onclose = () => {
                wsStatus.textContent = "切断 (再接続中...)";
                wsStatus.className = "status-badge disconnected";
                appendLog("WebSocketが切断されました。3秒後に再接続します。");
                setTimeout(connectWS, 3000);
            };

            ws.onerror = (err) => {
                console.error("WebSocketエラー:", err);
            };
        }

        function appendLog(text) {
            const timeStr = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${timeStr}] ${text}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- 4. 2地点間（複数報）による見かけの速度算出関数 ---
        function calculateDynamicVelocity(newReport, lat, lon) {
            const now = Date.now();
            const currentReportData = {
                lat: lat,
                lon: lon,
                time: now,
                reportNum: parseInt(newReport.ReportNum || 1)
            };

            if (reportHistory.length > 0) {
                const prev = reportHistory[reportHistory.length - 1];
                const distanceKm = getDistanceFromLatLonInKm(prev.lat, prev.lon, lat, lon);
                const timeDiffSec = (now - prev.time) / 1000;

                if (timeDiffSec > 0 && distanceKm > 0) {
                    const calculatedSpeed = distanceKm / timeDiffSec;
                    if (calculatedSpeed >= 2.0 && calculatedSpeed <= 10.0) {
                        P_SPEED = calculatedSpeed;
                        S_SPEED = calculatedSpeed * 0.55; 
                        appendLog(`[速度算出] 2報間の差分から速度を動的補正: P波=${P_SPEED.toFixed(2)}km/s`);
                    }
                }
            }

            reportHistory.push(currentReportData);
            if (reportHistory.length > 5) reportHistory.shift();
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        // --- 5. EEW電文の解析と文字・地図への反映 ---
        function parseEEW(data) {
            const reportNum = data.ReportNum || "?";
            const hypo = data.Hypocenter || "不明"; // 正しいプロパティ名 Hypocenter
            const mag = data.Magnitude || 0.0;
            const maxInt = data.MaxIntensity || "不明";
            const depth = data.Depth || "不明"; 
            const lat = data.Latitude;
            const lon = data.Longitude;
            const originTimeString = data.OriginTime; // "YYYY/MM/DD HH:mm:ss"
            const isFinal = data.isFinal ? "【最終報】" : "";
            const warnAreas = data.WarnArea || [];

            let logText = `[第${reportNum}報] ${isFinal}\n`;
            logText += ` ┣ 震源地: ${hypo} (深さ: ${depth})\n`;
            logText += ` ┣ 発生時刻: ${originTimeString}\n`;
            logText += ` ┣ 規模: M${mag} / 最大予想震度: ${maxInt}\n`;
            logText += ` ┗ 警戒地域・予想震度:\n`;

            warnAreas.forEach(area => {
                const areaName = area.AreaName || "地域不明";
                const alertType = area.Type || "予報";
                const intensity = area.MaxIntensity || maxInt;
                logText += `    ・ ${areaName} (${alertType}) 予想震度: ${intensity}\n`;
            });

            appendLog(logText);

            if (!lat || !lon) {
                appendLog("-> 震源の緯度・経度情報がまだ含まれていません。");
                return;
            }

            // OriginTime（地震発生時刻文字列）をミリ秒タイムスタンプに変換して初期化
            if (originTimeString) {
                // "YYYY/MM/DD HH:mm:ss" を JSで解釈可能な "YYYY-MM-DDTHH:mm:ss" に置換してパース
                const parsedTime = new Date(originTimeString.replace(/\//g, '-')).getTime();
                if (!isNaN(parsedTime)) {
                    earthquakeStartTime = parsedTime;
                }
            }
            
            // 万が一 OriginTime が取得できない場合のフォールバック
            if (!earthquakeStartTime) {
                earthquakeStartTime = Date.now();
            }

            calculateDynamicVelocity(data, lat, lon);

            alertBox.classList.add("active");
            alertDetails.innerHTML = `震源: ${hypo} (深さ: ${depth})<br>規模: M${mag} / 最大予想震度: ${maxInt}`;

            currentHypo = { lat: lat, lon: lon };

            updateMapElements(lat, lon, hypo, mag, maxInt, depth);
        }

        // --- 6. 地図上の描画更新 (震源・P/S波) ---
        function updateMapElements(lat, lon, hypo, mag, maxInt, depth) {
            if (hypoMarker) map.removeLayer(hypoMarker);
            if (pWaveCircle) map.removeLayer(pWaveCircle);
            if (sWaveCircle) map.removeLayer(sWaveCircle);

            hypoMarker = L.circleMarker([lat, lon], {
                radius: 8,
                color: '#fff',
                weight: 2,
                fillColor: '#ff4d4f',
                fillOpacity: 1
            }).addTo(map).bindPopup(`<b>震源: ${hypo}</b><br>深さ: ${depth} / M${mag} / 震度${maxInt}`);

            map.setView([lat, lon], 7);

            pWaveCircle = L.circle([lat, lon], {
                radius: 0,
                color: '#3bc9db',
                weight: 1,
                fillColor: '#3bc9db',
                fillOpacity: 0.1,
                dashArray: '4, 4'
            }).addTo(map);

            sWaveCircle = L.circle([lat, lon], {
                radius: 0,
                color: '#ff6b6b',
                weight: 2,
                fillColor: '#ff6b6b',
                fillOpacity: 0.2
            }).addTo(map);
        }

        // --- 7. P波・S波のリアルタイム拡大アニメーション（OriginTime起点） ---
        setInterval(() => {
            if (!currentHypo || !earthquakeStartTime) return;

            // 地震発生時刻からの正確な経過秒数を計算
            const elapsedSeconds = (Date.now() - earthquakeStartTime) / 1000;
            if (elapsedSeconds < 0) return; // 未来時刻への配慮

            const pRadius = P_SPEED * elapsedSeconds * 1000;
            const sRadius = S_SPEED * elapsedSeconds * 1000;

            if (pWaveCircle) pWaveCircle.setRadius(pRadius);
            if (sWaveCircle) sWaveCircle.setRadius(sRadius);
        }, 100);

        function resetAllLayers() {
            if (hypoMarker) map.removeLayer(hypoMarker);
            if (pWaveCircle) map.removeLayer(pWaveCircle);
            if (sWaveCircle) map.removeLayer(sWaveCircle);
            alertBox.classList.remove("active");
            currentHypo = null;
            earthquakeStartTime = null;
            reportHistory = [];
        }

        // アプリ起動時に接続開始
        connectWS();
    </script>
</body>
</html>
