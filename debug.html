<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リアルタイムEEW & 強震モニタ・PS波マップ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f111a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 420px;
            background-color: #161925;
            border-left: 1px solid #2a2f45;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
            z-index: 1000;
            order: 2;
            overflow-y: auto;
        }
        .header {
            padding: 15px;
            background-color: #1f2438;
            border-bottom: 1px solid #2a2f45;
            flex-shrink: 0;
        }
        .header h1 { font-size: 1.1rem; margin: 0 0 6px 0; color: #4dabf7; }
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .connected { background-color: #2b8a3e; color: #fff; }
        .disconnected { background-color: #c92a2a; color: #fff; }
        .sound-btn {
            background-color: #2b8a3e;
            color: #fff;
            border: none;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }
        .sound-btn.muted {
            background-color: #495057;
            color: #dee2e6;
        }
        
        .log-wrapper {
            padding: 10px 15px 0 15px;
            font-size: 0.85rem;
            color: #8b9bb4;
            font-weight: bold;
            flex-shrink: 0;
        }
        .log-container {
            height: 140px;
            margin: 5px 15px 10px 15px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            background-color: #0b0d14;
            color: #51cf66;
            white-space: pre-wrap;
            border: 1px solid #2a2f45;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .kmoni-section {
            background-color: #11141d;
            border-top: 1px solid #2a2f45;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-height: 360px;
        }
        .kmoni-title {
            width: 100%;
            font-size: 0.75rem;
            color: #8b9bb4;
            font-weight: bold;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .kmoni-frame-wrapper {
            width: 100%;
            height: 528px; 
            overflow: hidden;
            position: relative;
            border-radius: 4px;
            background-color: #000;
        }
        .kmoni-frame {
            width: 1200px;  
            height: 800px; 
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            transform: scale(0.768);
            transform-origin: top left;
        }
        .eew-alert {
            margin: 15px 15px 0 15px;
            padding: 12px;
            background-color: #5c1d1d;
            border: 1px solid #fa5252;
            border-radius: 6px;
            display: none;
            flex-shrink: 0;
        }
        .eew-alert.active { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        #map {
            flex: 1;
            height: 100%;
            background-color: #1a1a1a;
            order: 1;
        }

        /* --- カスタムポップアップ（P2P地震情報用）のスタイル --- */
        #p2pModalOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.72);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #p2pModalOverlay.active { display: flex; }
        .p2p-modal-content {
            background-color: #161925;
            border: 1px solid #3b5bdb;
            border-radius: 8px;
            width: 680px;
            max-width: 92vw;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0,0,0,0.85);
            overflow: hidden;
        }
        .p2p-modal-header {
            padding: 12px 18px;
            background-color: #1f2438;
            border-bottom: 1px solid #2a2f45;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .p2p-modal-header h3 { margin: 0; font-size: 1rem; color: #74c0fc; }
        .p2p-modal-close {
            background: none; border: none; color: #adb5bd; font-size: 1.2rem; cursor: pointer;
        }
        .p2p-modal-close:hover { color: #fff; }
        .p2p-modal-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .p2p-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
            background-color: #0b0d14;
            padding: 10px 12px;
            border-radius: 4px;
            border: 1px solid #2a2f45;
        }
        #p2pModalMap {
            width: 100%;
            height: 340px;
            border-radius: 4px;
            background-color: #111;
            flex-shrink: 0;
        }
        .p2p-points-list {
            background-color: #0b0d14;
            border: 1px solid #2a2f45;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.8rem;
            max-height: 130px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .p2p-point-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 7px;
            border-radius: 4px;
            background-color: #161925;
            border: 1px solid #2a2f45;
            color: #e9ecef;
        }
        .p2p-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.35);
        }
        .custom-hypo-cross {
            background: transparent;
            border: none;
        }

        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1f2438 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="sidebar">
        <div class="header">
            <h1>🌐 Wolfx EEW リアルタイム監視</h1>
            <div class="status-row">
                <div>WebSocket接続: <span id="wsStatus" class="status-badge disconnected">切断中</span></div>
                <button id="soundToggleBtn" class="sound-btn" type="button" onclick="toggleSound()">🔊 音声: ON</button>
            </div>
        </div>

        <div id="alertBox" class="eew-alert">
            <strong style="color: #ff6b6b;">⚠️ 緊急地震速報 発令中</strong>
            <p id="alertDetails" style="margin: 5px 0 0 0; font-size: 0.9rem;"></p>
        </div>
        <div class="log-wrapper">受信ログ & 地域別予想震度</div>
        <div id="logBox" class="log-container">システム初期化中... WebSocket接続を待機しています。</div>
        <div class="kmoni-section">
            <div class="kmoni-title">📈 リアルタイム強震モニタ (eqdata)</div>
            <div class="kmoni-frame-wrapper">
                <iframe src="https://eqdata.sakura.ne.jp/kyoshin/ws/2sec_alm_i.html" class="kmoni-frame"></iframe>
            </div>
        </div>
    </div>

    <!-- P2P地震情報カスタムポップアップ用モーダル -->
    <div id="p2pModalOverlay" onclick="closeP2PModal()">
        <div class="p2p-modal-content" onclick="event.stopPropagation(); resetModalInactivityTimer();">
            <div class="p2p-modal-header">
                <h3 id="p2pModalTitle">地震情報詳細</h3>
                <button class="p2p-modal-close" type="button" onclick="closeP2PModal()">✕</button>
            </div>
            <div class="p2p-modal-body" onscroll="resetModalInactivityTimer()">
                <div class="p2p-info-grid" id="p2pModalInfo"></div>
                <div id="p2pModalMap"></div>
                <div class="p2p-points-list" id="p2pModalPoints"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script>
        // --- エスケープ関数 ---
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

        // --- 音声再生管理（ロック解除対応） ---
        let soundEnabled = true;
        let audioUnlocked = false;
        const audioPlayer = new Audio();
        const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";

        function unlockAudio() {
            if (audioUnlocked) return;
            try {
                audioPlayer.src = SILENT_WAV;
                const p = audioPlayer.play();
                if (p && typeof p.then === "function") {
                    p.then(() => { audioUnlocked = true; }).catch(() => {});
                }
            } catch (_) {}
        }

        ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, unlockAudio));

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById("soundToggleBtn");
            if (soundEnabled) {
                btn.textContent = "🔊 音声: ON";
                btn.classList.remove("muted");
                unlockAudio();
            } else {
                btn.textContent = "🔇 音声: OFF";
                btn.classList.add("muted");
                audioPlayer.pause();
            }
        }

        function playSound(filename) {
            if (!soundEnabled || !filename) return;
            try {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
                audioPlayer.src = filename;
                const p = audioPlayer.play();
                if (p && typeof p.catch === "function") {
                    p.catch(() => {});
                }
            } catch (_) {}
        }

        // --- P2P震度カラーマップ ---
        const scaleColorMap = {
            10: "#2b82c9", // 震度1: 青
            20: "#50cc50", // 震度2: 黄緑
            30: "#e6e600", // 震度3: 黄色
            40: "#ff9900", // 震度4: オレンジ
            45: "#ff5c5c", // 震度5弱: 赤（薄め）
            46: "#ff5c5c", // 震度5弱以上(推定)
            50: "#b30000", // 震度5強: 赤（濃いめ）
            55: "#c77dff", // 震度6弱: 紫（薄め）
            60: "#7209b7", // 震度6強: 紫（濃いめ）
            70: "#240046"  // 震度7: 紫（黒に近い）
        };

        function getScaleColor(scale) {
            return scaleColorMap[scale] || "#6c757d";
        }

        // --- 都道府県代表座標（県ごとの最大震度マーカー表示用） ---
        const PREF_COORDS = {
            "北海道": [43.064, 141.347], "青森県": [40.824, 140.740], "岩手県": [39.704, 141.153],
            "宮城県": [38.269, 140.872], "秋田県": [39.719, 140.102], "山形県": [38.240, 140.363],
            "福島県": [37.750, 140.468], "茨城県": [36.342, 140.447], "栃木県": [36.566, 139.884],
            "群馬県": [36.391, 139.061], "埼玉県": [35.857, 139.649], "千葉県": [35.605, 140.123],
            "東京都": [35.689, 139.692], "神奈川県": [35.448, 139.643], "新潟県": [37.902, 139.023],
            "富山県": [36.695, 137.211], "石川県": [36.595, 136.626], "福井県": [36.065, 136.222],
            "山梨県": [35.664, 138.568], "長野県": [36.651, 138.181], "岐阜県": [35.391, 136.722],
            "静岡県": [34.977, 138.383], "愛知県": [35.180, 136.907], "三重県": [34.730, 136.509],
            "滋賀県": [35.005, 135.869], "京都府": [35.021, 135.756], "大阪府": [34.686, 135.520],
            "兵庫県": [34.691, 135.183], "奈良県": [34.685, 135.833], "和歌山県": [34.226, 135.168],
            "鳥取県": [35.504, 134.238], "島根県": [35.472, 133.051], "岡山県": [34.662, 133.935],
            "広島県": [34.397, 132.459], "山口県": [34.186, 131.471], "徳島県": [34.066, 134.559],
            "香川県": [34.340, 134.043], "愛媛県": [33.842, 132.766], "高知県": [33.560, 133.531],
            "福岡県": [33.606, 130.418], "佐賀県": [33.249, 130.301], "長崎県": [32.745, 129.874],
            "熊本県": [32.790, 130.742], "大分県": [33.238, 131.613], "宮崎県": [31.911, 131.424],
            "鹿児島県": [31.560, 130.558], "沖縄県": [26.212, 127.681]
        };

        // --- メイン地図初期化 ---
        const map = L.map('map', {
            center: [38.0, 137.0],
            zoom: 5,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        const darkStyle = document.createElement('style');
        darkStyle.innerHTML = `
            #map .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
            #map.leaflet-container { background-color: #111 !important; }
        `;
        document.head.appendChild(darkStyle);

        // --- P2P用モーダルマップの初期化 ---
        let p2pModalMap = null;
        let p2pLayerGroup = null;

        function initP2PModalMap() {
            if (!p2pModalMap) {
                p2pModalMap = L.map('p2pModalMap', { zoomControl: true }).setView([38.0, 137.0], 5);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(p2pModalMap);
                
                const modalDarkStyle = document.createElement('style');
                modalDarkStyle.innerHTML = `
                    #p2pModalMap .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
                    #p2pModalMap.leaflet-container { background-color: #111 !important; }
                `;
                document.head.appendChild(modalDarkStyle);

                p2pLayerGroup = L.layerGroup().addTo(p2pModalMap);
            }
        }

        // --- 状態管理変数 ---
        let hypoMarker = null;
        let pWaveCircle = null;
        let sWaveCircle = null;
        let currentHypo = null;
        let currentDepthKm = 0;
        
        const P_SPEED = 6.5; 
        const S_SPEED = 3.5; 
        let earthquakeStartTime = null;
        let finalReportTimer = null;

        let activeEewId = null;
        let lastEewReportNum = 0;

        const wsStatus = document.getElementById("wsStatus");
        const logBox = document.getElementById("logBox");
        const alertBox = document.getElementById("alertBox");
        const alertDetails = document.getElementById("alertDetails");

        // --- Wolfx WebSocket 接続 ---
        const wsUrl = "wss://ws-api.wolfx.jp/jma_eew";
        let ws;

        function connectWS() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                wsStatus.textContent = "接続中 (常時監視)";
                wsStatus.className = "status-badge connected";
                appendLog("Wolfx WebSocket に接続しました。");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "heartbeat") return;

                    if (data.isCancel) {
                        const cancelId = data.EventID || data.ID || null;
                        if (activeEewId !== null && cancelId !== null && activeEewId !== cancelId) {
                            appendLog(`【別イベントのキャンセル報を無視】 ID: ${cancelId}`);
                            return;
                        }
                        appendLog(`【キャンセル報】 ID: ${cancelId || ""}`);
                        playSound("eewC.mp3");
                        resetAllLayers();
                        return;
                    }

                    parseEEW(data);
                } catch (e) {
                    console.error("JSONパースエラー:", e);
                }
            };

            ws.onclose = () => {
                wsStatus.textContent = "切断 (再接続中...)";
                wsStatus.className = "status-badge disconnected";
                appendLog("WebSocketが切断されました。3秒後に再接続します。");
                setTimeout(connectWS, 3000);
            };

            ws.onerror = (err) => {
                console.error("WebSocketエラー:", err);
            };
        }

        function appendLog(text) {
            logBox.appendChild(document.createTextNode(`[${new Date().toLocaleTimeString()}] ${text}\n`));
            while (logBox.childNodes.length > 300) {
                logBox.removeChild(logBox.firstChild);
            }
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- 震度文字列から数値スコア（10〜70、不明/推定なしは0）へ変換 ---
        function parseEewIntensityScore(maxInt) {
            if (maxInt === null || maxInt === undefined) return 0;
            const s = String(maxInt).trim();
            if (!s || s === "不明" || s === "-" || s === "0") return 0;
            if (s.includes("7")) return 70;
            if (s.includes("6強") || s.includes("6+")) return 65;
            if (s.includes("6弱") || s.includes("6-")) return 60;
            if (s.includes("5強") || s.includes("5+")) return 55;
            if (s.includes("5弱") || s.includes("5-")) return 50;
            if (s.includes("4")) return 40;
            if (s.includes("3")) return 30;
            if (s.includes("2")) return 20;
            if (s.includes("1")) return 10;
            return 0;
        }

        function isEewWarning(data) {
            if (data.isWarn === true) return true;
            if (typeof data.Title === "string" && data.Title.includes("警報")) return true;
            if (Array.isArray(data.WarnArea) && data.WarnArea.some(a => a && a.Type === "警報")) return true;
            return false;
        }

        // --- EEW解析 & 音声通知 ---
        function parseEEW(data) {
            const eventId = data.EventID || data.ID || `${data.OriginTime || ""}_${data.Hypocenter || ""}`;
            const rawSerial = data.Serial ?? data.ReportNum;
            const reportNum = parseInt(rawSerial ?? 1, 10) || 1;
            const hypo = data.Hypocenter || "不明"; 
            const mag = parseFloat(data.Magnitude || 0.0);
            const maxInt = data.MaxIntensity || "不明";
            const depth = data.Depth || "不明"; 
            const lat = data.Latitude;
            const lon = data.Longitude;
            const originTimeString = data.OriginTime; 
            const isFinal = Boolean(data.isFinal);

            const originMs = originTimeString
                ? new Date(String(originTimeString).replace(/\//g, "-").replace(" ", "T") + "+09:00").getTime()
                : NaN;
            if (!isNaN(originMs) && Date.now() - originMs > 5 * 60 * 1000) return; // 古い報
            if (rawSerial != null && activeEewId === eventId && reportNum <= lastEewReportNum) return; // 重複

            const isSameEventUpdate = (activeEewId === eventId && (rawSerial == null || reportNum > lastEewReportNum));

            if (isFinal && isSameEventUpdate) {
                playSound("koushinE.mp3");
            } else if (isSameEventUpdate) {
                playSound("koushin.mp3");
            } else {
                const score = parseEewIntensityScore(maxInt);
                if (isEewWarning(data) || score >= 50) {
                    playSound("eew5.mp3");
                } else if (score >= 30) {
                    playSound("eew3.mp3");
                } else {
                    playSound("eew0.mp3");
                }
            }

            activeEewId = eventId;
            lastEewReportNum = reportNum;

            let logText = `[第${reportNum}報] ${isFinal ? "【最終報】" : ""}\n`;
            logText += ` ┣ 震源地: ${hypo} (深さ: ${depth})\n`;
            logText += ` ┣ 発生時刻: ${originTimeString}\n`;
            logText += ` ┣ 規模: M${mag} / 最大予想震度: ${maxInt}\n`;
            appendLog(logText);

            if (!lat || !lon) return;

            earthquakeStartTime = !isNaN(originMs) ? originMs : Date.now();
            currentDepthKm = parseFloat(data.Depth) || 0;

            alertBox.classList.add("active");
            alertDetails.innerHTML = `震源: ${esc(hypo)} (深さ: ${esc(depth)})<br>規模: M${esc(mag)} / 最大予想震度: ${esc(maxInt)}`;

            currentHypo = { lat: lat, lon: lon };
            updateMapElements(lat, lon, hypo, mag, maxInt, depth, !isSameEventUpdate);

            if (finalReportTimer) clearTimeout(finalReportTimer);
            finalReportTimer = setTimeout(resetAllLayers, 5 * 60 * 1000);
        }

        function updateMapElements(lat, lon, hypo, mag, maxInt, depth, shouldCenterMap = false) {
            if (hypoMarker) map.removeLayer(hypoMarker);
            if (pWaveCircle) map.removeLayer(pWaveCircle);
            if (sWaveCircle) map.removeLayer(sWaveCircle);

            hypoMarker = L.circleMarker([lat, lon], {
                radius: 8,
                color: '#fff',
                weight: 2,
                fillColor: '#ff4d4f',
                fillOpacity: 1
            }).addTo(map).bindPopup(`<b>震源: ${esc(hypo)}</b><br>深さ: ${esc(depth)} / M${esc(mag)} / 震度${esc(maxInt)}`);

            if (shouldCenterMap) {
                map.setView([lat, lon], 7);
            }

            pWaveCircle = L.circle([lat, lon], { radius: 0, color: '#3bc9db', weight: 1, fillOpacity: 0.1, dashArray: '4, 4' }).addTo(map);
            sWaveCircle = L.circle([lat, lon], { radius: 0, color: '#ff6b6b', weight: 2, fillOpacity: 0.2 }).addTo(map);
        }

        setInterval(() => {
            if (!currentHypo || !earthquakeStartTime) return;
            const elapsedSeconds = (Date.now() - earthquakeStartTime) / 1000;
            if (elapsedSeconds < 0) return;

            const surfaceKm = v => {
                const d = v * elapsedSeconds;
                return d > currentDepthKm ? Math.sqrt(d * d - currentDepthKm * currentDepthKm) : 0;
            };

            if (pWaveCircle) pWaveCircle.setRadius(surfaceKm(P_SPEED) * 1000);
            if (sWaveCircle) sWaveCircle.setRadius(surfaceKm(S_SPEED) * 1000);
        }, 100);

        function resetAllLayers() {
            if (hypoMarker) { map.removeLayer(hypoMarker); hypoMarker = null; }
            if (pWaveCircle) { map.removeLayer(pWaveCircle); pWaveCircle = null; }
            if (sWaveCircle) { map.removeLayer(sWaveCircle); sWaveCircle = null; }
            alertBox.classList.remove("active");
            currentHypo = null;
            currentDepthKm = 0;
            earthquakeStartTime = null;
            activeEewId = null;
            lastEewReportNum = 0;
            if (finalReportTimer) { clearTimeout(finalReportTimer); finalReportTimer = null; }
        }

        // --- P2P地震情報 API & カスタムポップアップ処理 ---
        let lastProcessedId = null;
        let modalTimeout = null;
        const MODAL_INACTIVITY_MS = 90000; // 1分半（90秒）

        function resetModalInactivityTimer() {
            const overlay = document.getElementById("p2pModalOverlay");
            if (!overlay.classList.contains("active")) return;
            if (modalTimeout) clearTimeout(modalTimeout);
            modalTimeout = setTimeout(() => {
                closeP2PModal();
            }, MODAL_INACTIVITY_MS);
        }

        async function initP2P() {
            try {
                const response = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=1');
                if (!response.ok) return;
                const data = await response.json();
                if (data && data.length > 0) {
                    lastProcessedId = data[0].id;
                }
            } catch (err) {
                console.error("P2P初期化エラー:", err);
            }
        }

        async function pollP2P() {
            try {
                const response = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=1');
                if (!response.ok) return;
                const data = await response.json();
                if (data && data.length > 0) {
                    const item = data[0];
                    if (lastProcessedId === null) {
                        lastProcessedId = item.id;
                    } else if (lastProcessedId !== item.id) {
                        lastProcessedId = item.id;
                        showP2PModal(item);
                    }
                }
            } catch (err) {
                console.error("P2Pポーリングエラー:", err);
            }
        }

        function showP2PModal(item) {
            try {
                const issue = item.issue || {};
                const eq = item.earthquake || {};
                const hypo = eq.hypocenter || {};
                const points = Array.isArray(item.points) ? item.points : [];

                const issueTypeLabel = formatIssueType(issue.type);
                document.getElementById("p2pModalTitle").textContent =
                    `地震情報（${issueTypeLabel}） - ${issue.time || eq.time || ""}`;

                const depthText = (typeof hypo.depth === "number" && hypo.depth >= 0)
                    ? `${hypo.depth} km`
                    : "不明";
                const magText = (typeof hypo.magnitude === "number" && hypo.magnitude >= 0)
                    ? `M${hypo.magnitude.toFixed(1)}`
                    : "不明";

                const infoGrid = document.getElementById("p2pModalInfo");
                infoGrid.innerHTML = `
                    <div><b>発生時刻:</b> ${esc(eq.time || "不明")}</div>
                    <div><b>震源地:</b> ${esc(hypo.name || "不明")}</div>
                    <div><b>深さ:</b> ${esc(depthText)}</div>
                    <div><b>規模 (M):</b> ${esc(magText)}</div>
                    <div><b>最大震度:</b> ${esc(formatScale(eq.maxScale))}</div>
                    <div><b>発表種類:</b> ${esc(issueTypeLabel)}</div>
                `;

                const overlay = document.getElementById("p2pModalOverlay");
                overlay.classList.add("active");

                playSound("VXSE53.mp3");

                initP2PModalMap();
                p2pLayerGroup.clearLayers();

                const hasValidCoords =
                    typeof hypo.latitude === "number" &&
                    typeof hypo.longitude === "number" &&
                    hypo.latitude >= -90 && hypo.latitude <= 90 &&
                    hypo.longitude >= -180 && hypo.longitude <= 180;

                if (hasValidCoords) {
                    const hypoIcon = L.divIcon({
                        className: 'custom-hypo-cross',
                        html: `<div style="font-size: 28px; font-weight: bold; color: #ff1e1e; text-shadow: -2px -2px 0 #ffd43b, 2px -2px 0 #ffd43b, -2px 2px 0 #ffd43b, 2px 2px 0 #ffd43b, 0 0 6px #ffd43b; line-height: 28px; text-align: center;">×</div>`,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });
                    L.marker([hypo.latitude, hypo.longitude], { icon: hypoIcon, zIndexOffset: 500 })
                        .addTo(p2pLayerGroup)
                        .bindPopup(`<b>震源: ${esc(hypo.name || "不明")}</b><br>深さ: ${esc(depthText)} / ${esc(magText)}`);

                    p2pModalMap.setView([hypo.latitude, hypo.longitude], 6);
                } else {
                    p2pModalMap.setView([38.0, 137.0], 5);
                }

                const pointsContainer = document.getElementById("p2pModalPoints");
                pointsContainer.innerHTML = "";

                const sortedPoints = [...points].sort((a, b) => (b.scale || 0) - (a.scale || 0));

                if (sortedPoints.length === 0) {
                    pointsContainer.innerHTML = `<span style="color:#adb5bd;">観測点・地域震度データはありません。</span>`;
                } else {
                    const prefMax = {};
                    points.forEach(p => {
                        const s = p.scale || 0;
                        if (p.pref && PREF_COORDS[p.pref] && s > (prefMax[p.pref] ?? -1)) prefMax[p.pref] = s;
                    });
                    Object.entries(prefMax).forEach(([pref, scale]) => {
                        L.circleMarker(PREF_COORDS[pref], {
                            radius: 8, color: '#111', weight: 1,
                            fillColor: getScaleColor(scale), fillOpacity: 0.92
                        }).addTo(p2pLayerGroup).bindPopup(`<b>${esc(pref)}</b><br>最大震度 ${esc(formatScale(scale))}`);
                    });

                    sortedPoints.forEach(p => {
                        const color = getScaleColor(p.scale);
                        const scaleLabel = formatScale(p.scale);
                        const name = p.addr || p.pref || "地域不明";

                        const badge = document.createElement("span");
                        badge.className = "p2p-point-badge";
                        badge.innerHTML = `<span class="p2p-color-dot" style="background-color:${esc(color)};"></span><span>${esc(name)}</span><strong>震度${esc(scaleLabel)}</strong>`;
                        pointsContainer.appendChild(badge);
                    });
                }

                setTimeout(() => {
                    if (p2pModalMap) p2pModalMap.invalidateSize();
                }, 150);

                resetModalInactivityTimer();
            } catch (err) {
                console.error("P2Pモーダル表示エラー:", err);
            }
        }

        // --- テスト用トリガー（最新P2Pデータまたはサンプルでモーダル & VXSE53.mp3 をプレビュー） ---
        async function previewLatestP2PQuake() {
            unlockAudio();
            try {
                const response = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=1');
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        showP2PModal(data[0]);
                        return;
                    }
                }
            } catch (_) {}

            showP2PModal({
                issue: { type: "DetailScale", time: new Date().toISOString().replace("T", " ").slice(0, 19) },
                earthquake: {
                    time: new Date().toISOString().replace("T", " ").slice(0, 19),
                    maxScale: 40,
                    hypocenter: {
                        name: "岩手県内陸北部",
                        depth: 10,
                        magnitude: 4.8,
                        latitude: 39.7,
                        longitude: 141.1
                    }
                },
                points: [
                    { pref: "岩手県", addr: "盛岡市", scale: 40 },
                    { pref: "岩手県", addr: "八幡平市", scale: 30 },
                    { pref: "宮城県", addr: "気仙沼市", scale: 20 },
                    { pref: "秋田県", addr: "仙北市", scale: 10 }
                ]
            });
        }
        window.testP2PModal = previewLatestP2PQuake;

        function closeP2PModal() {
            const overlay = document.getElementById("p2pModalOverlay");
            overlay.classList.remove("active");
            if (modalTimeout) {
                clearTimeout(modalTimeout);
                modalTimeout = null;
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeP2PModal();
        });

        function formatIssueType(type) {
            const typeMap = {
                "ScalePrompt": "震度速報",
                "Destination": "震源に関する情報",
                "ScaleAndDestination": "震源・震度に関する情報",
                "DetailScale": "各地の震度に関する情報",
                "Foreign": "遠地地震に関する情報",
                "Other": "その他の情報"
            };
            return typeMap[type] || type || "地震情報";
        }

        function formatScale(scale) {
            const scaleMap = {
                10: '1', 20: '2', 30: '3', 40: '4',
                45: '5弱', 46: '5弱以上(推定)', 50: '5強', 55: '6弱', 60: '6強', 70: '7'
            };
            return scaleMap[scale] || '不明';
        }

        // 初期実行
        connectWS();
        initP2P().then(() => {
            setInterval(pollP2P, 10000);
        });
    </script>
</body>
</html>
