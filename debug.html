<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リアルタイムEEW & 強震モニタ・PS波マップ</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f111a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 420px;
            background-color: #161925;
            border-left: 1px solid #2a2f45;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
            z-index: 1000;
            order: 2;
        }
        .header {
            padding: 15px;
            background-color: #1f2438;
            border-bottom: 1px solid #2a2f45;
            flex-shrink: 0;
        }
        .header h1 { font-size: 1.1rem; margin: 0 0 5px 0; color: #4dabf7; }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .connected { background-color: #2b8a3e; color: #fff; }
        .disconnected { background-color: #c92a2a; color: #fff; }
        
        .log-wrapper {
            padding: 10px 15px 0 15px;
            font-size: 0.85rem;
            color: #8b9bb4;
            font-weight: bold;
            flex-shrink: 0;
        }
        .log-container {
            height: 140px;
            margin: 5px 15px 10px 15px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            background-color: #0b0d14;
            color: #51cf66;
            white-space: pre-wrap;
            border: 1px solid #2a2f45;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .kmoni-section {
            background-color: #11141d;
            border-top: 1px solid #2a2f45;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .kmoni-title {
            width: 100%;
            font-size: 0.75rem;
            color: #8b9bb4;
            font-weight: bold;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .kmoni-frame-wrapper {
            width: 100%;
            height: 528px; 
            overflow: hidden;
            position: relative;
            border-radius: 4px;
            background-color: #000;
        }
        .kmoni-frame {
            width: 1200px;  
            height: 900px; 
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            transform: scale(0.768);
            transform-origin: top left;
        }
        .eew-alert {
            margin: 15px 15px 0 15px;
            padding: 12px;
            background-color: #5c1d1d;
            border: 1px solid #fa5252;
            border-radius: 6px;
            display: none;
            flex-shrink: 0;
        }
        .eew-alert.active { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        #map {
            flex: 1;
            height: 100%;
            background-color: #1a1a1a;
            order: 1;
        }

        /* --- カスタムポップアップ（P2P地震情報用）のスタイル --- */
        #p2pModalOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #p2pModalOverlay.active { display: flex; }
        .p2p-modal-content {
            background-color: #161925;
            border: 1px solid #3b5bdb;
            border-radius: 8px;
            width: 650px;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .p2p-modal-header {
            padding: 12px 18px;
            background-color: #1f2438;
            border-bottom: 1px solid #2a2f45;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .p2p-modal-header h3 { margin: 0; font-size: 1rem; color: #74c0fc; }
        .p2p-modal-close {
            background: none; border: none; color: #adb5bd; font-size: 1.2rem; cursor: pointer;
        }
        .p2p-modal-close:hover { color: #fff; }
        .p2p-modal-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .p2p-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
            background-color: #0b0d14;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #2a2f45;
        }
        #p2pModalMap {
            width: 100%;
            height: 350px;
            border-radius: 4px;
            background-color: #111;
        }

        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1f2438 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="sidebar">
        <div class="header">
            <h1>🌐 Wolfx EEW リアルタイム監視</h1>
            <div>WebSocket接続: <span id="wsStatus" class="status-badge disconnected">切断中</span></div>
        </div>

        <div id="alertBox" class="eew-alert">
            <strong style="color: #ff6b6b;">⚠️ 緊急地震速報 発令中</strong>
            <p id="alertDetails" style="margin: 5px 0 0 0; font-size: 0.9rem;"></p>
        </div>
        <div class="log-wrapper">受信ログ & 地域別予想震度</div>
        <div id="logBox" class="log-container">システム初期化中... WebSocket接続を待機しています。</div>
        <div class="kmoni-section">
            <div class="kmoni-title">📈 リアルタイム強震モニタ (eqdata)</div>
            <div class="kmoni-frame-wrapper">
                <iframe src="https://eqdata.sakura.ne.jp/kyoshin/2sec_i.html" class="kmoni-frame"></iframe>
            </div>
        </div>
    </div>

    <!-- P2P地震情報カスタムポップアップ用モーダル -->
    <div id="p2pModalOverlay" onclick="closeP2PModal()">
        <div class="p2p-modal-content" onclick="event.stopPropagation()">
            <div class="p2p-modal-header">
                <h3 id="p2pModalTitle">地震情報詳細</h3>
                <button class="p2p-modal-close" onclick="closeP2PModal()">✕</button>
            </div>
            <div class="p2p-modal-body">
                <div class="p2p-info-grid" id="p2pModalInfo">
                    <!-- 地震詳細情報がここに挿入されます -->
                </div>
                <div id="p2pModalMap"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script>
        // --- 震度カラーマップ（指定された仕様に基づく配色） ---
        const scaleColorMap = {
            10: "#2b82c9", // 震度1: 青
            20: "#50cc50", // 震度2: 黄緑
            30: "#e6e600", // 震度3: 黄
            45: "#ff9900", // 震度4: オレンジ
            50: "#ff2600", // 震度5弱: 赤（薄め）
            55: "#b30000", // 震度5強: 赤（濃いめ）
            60: "#a800a8", // 震度6弱: 紫（薄め）
            65: "#550055", // 震度6強: 紫（濃いめ）
            70: "#220022"  // 震度7: 紫（黒に近い）
        };

        function getScaleColor(scale) {
            return scaleColorMap[scale] || "#555555";
        }

        // --- 音声再生用ヘルパー関数 ---
        function playAudio(filename) {
            const audio = new Audio(filename);
            audio.play().catch(err => {
                console.log("音声再生ブロックまたはファイル未存在:", err);
            });
        }

        // --- 地図初期化 ---
        const map = L.map('map', {
            center: [38.0, 137.0],
            zoom: 5,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        const darkStyle = document.createElement('style');
        darkStyle.innerHTML = `
            .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
            .leaflet-container { background-color: #111 !important; }
        `;
        document.head.appendChild(darkStyle);

        // --- P2P用モーダルマップの初期化 ---
        let p2pModalMap = null;
        let p2pLayerGroup = null;

        function initP2PModalMap() {
            if (!p2pModalMap) {
                p2pModalMap = L.map('p2pModalMap', { zoomControl: false }).setView([38.0, 137.0], 5);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(p2pModalMap);
                
                // モーダル内マップ用ダークフィルター
                const modalDarkStyle = document.createElement('style');
                modalDarkStyle.innerHTML = `
                    #p2pModalMap .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
                    #p2pModalMap { background-color: #111 !important; }
                `;
                document.head.appendChild(modalDarkStyle);

                p2pLayerGroup = L.layerGroup().addTo(p2pModalMap);
            }
        }

        // --- 状態管理変数 ---
        let hypoMarker = null;
        let pWaveCircle = null;
        let sWaveCircle = null;
        let currentHypo = null;
        
        let P_SPEED = 6.5; 
        let S_SPEED = 3.5; 
        let earthquakeStartTime = null;
        let finalReportTimer = null;
        let reportHistory = [];

        const wsStatus = document.getElementById("wsStatus");
        const logBox = document.getElementById("logBox");
        const alertBox = document.getElementById("alertBox");
        const alertDetails = document.getElementById("alertDetails");

        // --- Wolfx WebSocket 接続 ---
        const wsUrl = "wss://ws-api.wolfx.jp/jma_eew";
        let ws;

        function connectWS() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                wsStatus.textContent = "接続中 (常時監視)";
                wsStatus.className = "status-badge connected";
                appendLog("Wolfx WebSocket に接続しました。");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "heartbeat") return;

                    if (data.isCancel) {
                        appendLog(`【キャンセル報】 ID: ${data.ID}`);
                        playAudio("eewC.mp3"); // キャンセル報音声
                        resetAllLayers();
                        return;
                    }

                    parseEEW(data);
                } catch (e) {
                    console.error("JSONパースエラー:", e);
                }
            };

            ws.onclose = () => {
                wsStatus.textContent = "切断 (再接続中...)";
                wsStatus.className = "status-badge disconnected";
                appendLog("WebSocketが切断されました。3秒後に再接続します。");
                setTimeout(connectWS, 3000);
            };

            ws.onerror = (err) => {
                console.error("WebSocketエラー:", err);
            };
        }

        function appendLog(text) {
            const timeStr = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${timeStr}] ${text}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function calculateDynamicVelocity(newReport, lat, lon) {
            const now = Date.now();
            const currentReportData = { lat: lat, lon: lon, time: now, reportNum: parseInt(newReport.ReportNum || 1) };

            if (reportHistory.length > 0) {
                const prev = reportHistory[reportHistory.length - 1];
                const distanceKm = getDistanceFromLatLonInKm(prev.lat, prev.lon, lat, lon);
                const timeDiffSec = (now - prev.time) / 1000;

                if (timeDiffSec > 0 && distanceKm > 0) {
                    const calculatedSpeed = distanceKm / timeDiffSec;
                    if (calculatedSpeed >= 2.0 && calculatedSpeed <= 10.0) {
                        P_SPEED = calculatedSpeed;
                        S_SPEED = calculatedSpeed * 0.55; 
                    }
                }
            }
            reportHistory.push(currentReportData);
            if (reportHistory.length > 5) reportHistory.shift();
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // --- EEW解析 & 音声振り分け ---
        function parseEEW(data) {
            const reportNum = parseInt(data.ReportNum || 1);
            const hypo = data.Hypocenter || "不明"; 
            const mag = parseFloat(data.Magnitude || 0.0);
            const maxInt = data.MaxIntensity || "不明";
            const depth = data.Depth || "不明"; 
            const lat = data.Latitude;
            const lon = data.Longitude;
            const originTimeString = data.OriginTime; 
            const isFinal = data.isFinal;
            const warnAreas = data.WarnArea || [];

            // --- 音声再生の判定 ---
            if (isFinal) {
                playAudio("koushinE.mp3"); // 最終報
            } else if (reportNum > 1) {
                playAudio("koushin.mp3");  // 第n報 (第2報以降)
            } else {
                // 第1報の場合の最大震度に応じた音声
                // 最大震度が数値や文字列に含まれるケースを考慮して判定
                let maxIntVal = parseMaxIntensityValue(maxInt);
                if (maxIntVal >= 50) {
                    playAudio("eew5.mp3"); // 震度5以上
                } else if (maxIntVal >= 30) {
                    playAudio("eew3.mp3"); // 震度3以上
                } else {
                    playAudio("eew0.mp3"); // 震度3未満
                }
            }

            let logText = `[第${reportNum}報] ${isFinal ? "【最終報】" : ""}\n`;
            logText += ` ┣ 震源地: ${hypo} (深さ: ${depth})\n`;
            logText += ` ┣ 発生時刻: ${originTimeString}\n`;
            logText += ` ┣ 規模: M${mag} / 最大予想震度: ${maxInt}\n`;
            appendLog(logText);

            if (!lat || !lon) return;

            if (originTimeString) {
                const parsedTime = new Date(originTimeString.replace(/\//g, '-')).getTime();
                if (!isNaN(parsedTime)) earthquakeStartTime = parsedTime;
            }
            if (!earthquakeStartTime) earthquakeStartTime = Date.now();

            calculateDynamicVelocity(data, lat, lon);

            alertBox.classList.add("active");
            alertDetails.innerHTML = `震源: ${hypo} (深さ: ${depth})<br>規模: M${mag} / 最大予想震度: ${maxInt}`;

            currentHypo = { lat: lat, lon: lon };
            updateMapElements(lat, lon, hypo, mag, maxInt, depth);

            if (isFinal) {
                if (finalReportTimer) clearTimeout(finalReportTimer);
                finalReportTimer = setTimeout(() => {
                    resetAllLayers();
                }, 5 * 60 * 1000);
            }
        }

        function parseMaxIntensityValue(str) {
            if (!str) return 0;
            if (str.includes("7")) return 70;
            if (str.includes("6強")) return 65;
            if (str.includes("6弱")) return 60;
            if (str.includes("5強")) return 55;
            if (str.includes("5弱")) return 50;
            if (str.includes("4")) return 40;
            if (str.includes("3")) return 30;
            if (str.includes("2")) return 20;
            if (str.includes("1")) return 10;
            return 0;
        }

        function updateMapElements(lat, lon, hypo, mag, maxInt, depth) {
            if (hypoMarker) map.removeLayer(hypoMarker);
            if (pWaveCircle) map.removeLayer(pWaveCircle);
            if (sWaveCircle) map.removeLayer(sWaveCircle);

            hypoMarker = L.circleMarker([lat, lon], {
                radius: 8,
                color: '#fff',
                weight: 2,
                fillColor: '#ff4d4f',
                fillOpacity: 1
            }).addTo(map).bindPopup(`<b>震源: ${hypo}</b><br>深さ: ${depth} / M${mag} / 震度${maxInt}`);

            map.setView([lat, lon], 7);

            pWaveCircle = L.circle([lat, lon], { radius: 0, color: '#3bc9db', weight: 1, fillOpacity: 0.1, dashArray: '4, 4' }).addTo(map);
            sWaveCircle = L.circle([lat, lon], { radius: 0, color: '#ff6b6b', weight: 2, fillOpacity: 0.2 }).addTo(map);
        }

        setInterval(() => {
            if (!currentHypo || !earthquakeStartTime) return;
            const elapsedSeconds = (Date.now() - earthquakeStartTime) / 1000;
            if (elapsedSeconds < 0) return; 

            if (pWaveCircle) pWaveCircle.setRadius(P_SPEED * elapsedSeconds * 1000);
            if (sWaveCircle) sWaveCircle.setRadius(S_SPEED * elapsedSeconds * 1000);
        }, 100);

        function resetAllLayers() {
            if (hypoMarker) { map.removeLayer(hypoMarker); hypoMarker = null; }
            if (pWaveCircle) { map.removeLayer(pWaveCircle); pWaveCircle = null; }
            if (sWaveCircle) { map.removeLayer(sWaveCircle); sWaveCircle = null; }
            alertBox.classList.remove("active");
            currentHypo = null;
            earthquakeStartTime = null;
            reportHistory = [];
            if (finalReportTimer) { clearTimeout(finalReportTimer); finalReportTimer = null; }
        }

        // --- P2P地震情報 API & カスタムポップアップ・音声処理 ---
        let modalTimeout = null;

        async function fetchLatestP2PQuake() {
            try {
                const response = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=1');
                if (!response.ok) return;
                const data = await response.json();
                if (data && data.length > 0) {
                    processP2PEvent(data[0]);
                }
            } catch (err) {
                console.error("P2P取得エラー:", err);
            }
        }

        // 最新検知用のポーリング（新着判定用）
        let lastProcessedId = null;
        async function pollP2P() {
            try {
                const response = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=1');
                const data = await response.json();
                if (data && data.length > 0) {
                    const item = data[0];
                    if (lastProcessedId !== item.id) {
                        lastProcessedId = item.id;
                        processP2PEvent(item, true); // 新着時はポップアップ表示 & 音声再生
                    }
                }
            } catch (e) {}
        }

        function processP2PEvent(item, isNew = false) {
            const issue = item.issue;
            const eq = item.earthquake;
            const points = item.points || [];

            // --- issue.type に応じた音声再生 ---
            if (isNew && issue && issue.type) {
                if (issue.type === "ScalePrompt") {
                    playAudio("VXSE51.mp3");
                } else if (issue.type === "ScaleAndDestination" || issue.type === "Destination") {
                    playAudio("VXSE52.mp3");
                } else if (issue.type === "DetailScale") {
                    playAudio("VXSE53.mp3");
                }
            }

            if (isNew) {
                showP2PModal(item);
            }
        }

        function showP2PModal(item) {
            const issue = item.issue;
            const eq = item.earthquake;
            const points = item.points || [];

            document.getElementById("p2pModalTitle").textContent = `地震情報 (${issue.type || "詳細"}) - ${issue.time || ""}`;
            
            const infoGrid = document.getElementById("p2pModalInfo");
            infoGrid.innerHTML = `
                <div><b>発生時刻:</b> ${eq.time}</div>
                <div><b>震源地:</b> ${eq.hypoCenter.name || "不明"}</div>
                <div><b>深さ:</b> ${eq.hypoCenter.depth} km</div>
                <div><b>規模 (M):</b> ${eq.hypoCenter.magnitude}</div>
                <div><b>最大震度:</b> ${formatScale(eq.maxScale)}</div>
                <div><b>情報種類:</b> ${issue.type}</div>
            `;

            // モーダルを表示
            const overlay = document.getElementById("p2pModalOverlay");
            overlay.classList.add("active");

            initP2PModalMap();
            p2pLayerGroup.clearLayers();

            // 震源地の描画 (赤に黄色のアウトラインで大きめの×表示)
            if (eq.hypoCenter.latitude >= 0 && eq.hypoCenter.longitude >= 0) {
                const hypoIcon = L.divIcon({
                    className: 'custom-hypo-cross',
                    html: `<div style="font-size: 24px; font-weight: bold; color: #ff2600; text-shadow: -2px -2px 0 #e6e600, 2px -2px 0 #e6e600, -2px 2px 0 #e6e600, 2px 2px 0 #e6e600; line-height: 24px; text-align: center;">×</div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });
                L.marker([eq.hypoCenter.latitude, eq.hypoCenter.longitude], { icon: hypoIcon }).addTo(p2pLayerGroup)
                  .bindPopup(`<b>震源: ${eq.hypoCenter.name}</b>`);
                
                p2pModalMap.setView([eq.hypoCenter.latitude, eq.hypoCenter.longitude], 6);
            } else {
                p2pModalMap.setView([38.0, 137.0], 5);
            }

            // 観測点または地域ごとの色分け表示
            points.forEach(p => {
                if (p.latitude && p.longitude) {
                    const color = getScaleColor(p.scale);
                    L.circleMarker([p.latitude, p.longitude], {
                        radius: 5,
                        color: '#000',
                        weight: 1,
                        fillColor: color,
                        fillOpacity: 0.9
                    }).addTo(p2pLayerGroup).bindPopup(`${p.addr}: 震度${formatScale(p.scale)}`);
                }
            });

            setTimeout(() => { p2pModalMap.invalidateSize(); }, 200);

            // 1分半（90,000ms）操作なしで自動閉鎖するタイマーを設定
            if (modalTimeout) clearTimeout(modalTimeout);
            modalTimeout = setTimeout(() => {
                closeP2PModal();
            }, 90000);
        }

        function closeP2PModal() {
            const overlay = document.getElementById("p2pModalOverlay");
            overlay.classList.remove("active");
            if (modalTimeout) {
                clearTimeout(modalTimeout);
                modalTimeout = null;
            }
        }

        function formatScale(scale) {
            const scaleMap = {
